        GRUPPEMEDLEM 1 SVAR:
            
        Spørsmål 1:

        Jeg anser dette emnet som veldig relevant for både videre studier og senere når jeg 
        kommer ut i arbeidslivet. Dette emnet har gitt meg en grunnleggende kodeforståelse
        som jeg vil trenge for å bygge videre på egen kompetanse. Ikke bare for JavaScript, men
        også flere ulike programmeringsspråk som jeg kommer til å møte på i fremtiden.

        Når jeg kommer ut i arbeid, gjerne da noe innen nettsidebygging (frontent), eller 
        mobilutvikling, ettersom at jeg går frontend og mobilutvikling linjen. Så vil mine
        programmeringskunnskaper være helt avgjørende. Programmering er nødvendig for både 
        mobilutvikling, og nettsidebygging. JavaScript og gjerne andre rammeverk, samt bibloteker
        er nødvendig for å bygge en moderne og interaktiv nettside.

        Spørsmål 2 a):

        Jeg opplevde at alle modulene som ble gjennomgått i dette faget var håndterbart, så
        lenge man møtte opp på forelesningene og tok litt intiativ for egen læring. Likevel så kan
        jeg trekke fram hovedsakelig to teknikker som var noe utfordrende å lære:

        - Parametere: Dette teamet fant jeg noe utfordrende fordi det krevde en god forståelse av
        hvordan koden fungerer som en helhet. Selv om konseptet i seg selv kanskje ikke var alt
        for komplisert så tok det litt tid før jeg så mulighetene ved å ta i bruk dette.

        - Array-manipulasjon / CRUD: Dette temaet var også noe mer utfordrende. En av årsakene til
        dette var at det er et relativt stort tema med mange forskjellige metoder man kan ta i bruk
        som f.eks. .map(), .filter(), .unshift(), pop() osv.

        Spørsmål 2 b):

        Denne setningen refererer til det som gjerne kalles for "god kodestandard". Den fremhever
        viktigheten i det med å ikke bare produsere kode for å få den til å fungere, men koden
        skal også være forståelig med gode kommentarer, variabelnavn, funksjonsnavn osv. Dette
        er for å gjøre koden vedlikeholdbar for andre utviklere som gjerne skal bygge videre på
        din eksisterende kode i fremtiden.

        Det er svært sjeldent at man jobber individuelt med et prosjekt i jobbsammenheng, ofte så 
        jobber man sammen i større team på et prosjekt. Da er det ekstra viktig at alle som jobber
        i kodebasen følger en god kodestandard og gjør sitt beste for at andre ikke skal bruke
        unødvendig tid på å forstå koden man har laget.

        Spørsmål 3 a):

        Arbeidskravet gikk ut på at man skulle lage et enkelt spill med JavaScript, hvor vi fikk
        utdelt tre helter som skulle angripe en drage. Oppgaven fokuserte på grunnleggende
        programmeringskonsepter, og noe CSS-manipulasjon.

        Spørsmål 3 b):

        Det jeg syntes var noe av det mer krevende i arbeidskravet må bli det samme som de
        teknikkene jeg syntes var utfordrende å lære meg (nevt i oppgave 2a), men også det med å
        strukturere koden på en god og oversiktlig måte.

        Spørsmål 3 c):

        Til likhet med alle "større" kodeprosjekter, så kan det være smart å dele opp oppgaven
        i mindre deler for å finne ut av hvilke teknikker og løsninger man kan ta i bruk før man
        hiver seg på kodingen. Pseudokode er et godt eksempel på en teknikk som ofte blir brukt.

        Spørsmål 3 d):

        Jeg valgte å jobbe alene med arbeidskravet. Fordelen med å jobbe alene er at man slipper å
        sette seg inn i andre sin kode, og finne ut av hvordan man skal fordele arbeidsmengden.
        Ulempen med dette er jo at man får mindre innspill og ideer til forskjellige måter å løse
        oppgaven på. Det tar også gjerne lengre tid å kode alene da man ikke får fordelt på 
        arbeidsmengden.
